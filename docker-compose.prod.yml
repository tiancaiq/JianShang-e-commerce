# ─────────────────────────────────────────────────────────────
#  Application Services  (extends docker-compose.yml infra)
#  Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# ─────────────────────────────────────────────────────────────

services:
  # ── Product Service (MongoDB) ──────────────────────────────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-product-service}
      MONGO_PORT: 27017
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_DB_USERNAME:-root}:${MONGO_DB_PASSWORD:-password}@mongo:27017/${MONGO_DB_NAME:-product-service}?authSource=admin
      CATALOG_DB_HOST: mysql
      CATALOG_DB_PORT: 3306
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-root}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-mysql}}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/msb-local/protocol/openid-connect/certs}
      AUTH_SERVICE_URL: http://auth-service:8085
      LISTING_MEDIA_STORAGE: ${LISTING_MEDIA_STORAGE:-local-demo}
      LISTING_MEDIA_MAX_IMAGE_SIZE_BYTES: ${LISTING_MEDIA_MAX_IMAGE_SIZE_BYTES:-10485760}
      LISTING_MEDIA_SIGNED_URL_TTL: ${LISTING_MEDIA_SIGNED_URL_TTL:-PT15M}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-listing-media-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
    depends_on:
      - mongo
      - mysql
      - keycloak
      - auth-service
    restart: unless-stopped

  # ── Order Service (MySQL + Kafka) ──────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
    depends_on:
      - mysql
      - broker
    restart: unless-stopped

  # ── Inventory Service (MySQL) ──────────────────────────────
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    depends_on:
      - mysql
    restart: unless-stopped

  # ── Notification Service (Kafka + Mail) ────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MAIL_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    depends_on:
      - broker
      - mailpit
    restart: unless-stopped

  # ── Payment Service (MySQL) ────────────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    depends_on:
      - mysql
    restart: unless-stopped

  # ── Auth Service (PostgreSQL + JWT) ────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${IDENTITY_DB_NAME:-identity}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-mysql}}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/msb-local/protocol/openid-connect/certs}
      USER_AVATAR_STORAGE: ${USER_AVATAR_STORAGE:-${LISTING_MEDIA_STORAGE:-local-demo}}
      LISTING_MEDIA_STORAGE: ${LISTING_MEDIA_STORAGE:-local-demo}
      LISTING_MEDIA_SIGNED_URL_TTL: ${LISTING_MEDIA_SIGNED_URL_TTL:-PT15M}
      USER_AVATAR_MAX_SIZE_BYTES: ${USER_AVATAR_MAX_SIZE_BYTES:-5242880}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-listing-media-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
    depends_on:
      - mysql
      - keycloak
    restart: unless-stopped

  # ── API Gateway (routes to all services) ───────────────────
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      CHAT_DB_HOST: mysql
      CHAT_DB_PORT: 3306
      CHAT_DB_NAME: ${CHAT_DB_NAME:-chat}
      CHAT_DB_USERNAME: ${CHAT_DB_USERNAME:-root}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-mysql}}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      KEYCLOAK_BACKCHANNEL_ISSUER_URI: ${KEYCLOAK_BACKCHANNEL_ISSUER_URI:-http://keycloak:8080/realms/msb-local}
      AUTH_SERVICE_URL: http://auth-service:8085
      PRODUCT_SERVICE_URL: http://product-service:8091
    depends_on:
      - mysql
      - keycloak
      - auth-service
      - product-service
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "9000:9000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8091
      CHAT_SERVICE_URL: http://chat-service:8092
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      AUTH_SERVICE_URL: http://auth-service:8085
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8086}
      GATEWAY_FEATURE_AGENT: ${GATEWAY_FEATURE_AGENT:-false}
      GATEWAY_FEATURE_AGENT_DISCOVERY: ${GATEWAY_FEATURE_AGENT_DISCOVERY:-false}
      KEYCLOAK_BROWSER_ISSUER_URI: ${KEYCLOAK_BROWSER_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      KEYCLOAK_BACKCHANNEL_BASE_URI: ${KEYCLOAK_BACKCHANNEL_BASE_URI:-http://keycloak:8080}
      KEYCLOAK_BACKCHANNEL_ISSUER_URI: ${KEYCLOAK_BACKCHANNEL_ISSUER_URI:-${KEYCLOAK_BROWSER_ISSUER_URI:-http://localhost:8181/realms/msb-local}}
      KEYCLOAK_MARKETPLACE_CLIENT_ID: ${KEYCLOAK_MARKETPLACE_CLIENT_ID:-msb-marketplace}
      KEYCLOAK_MARKETPLACE_CLIENT_SECRET: ${KEYCLOAK_MARKETPLACE_CLIENT_SECRET:-local-dev-only-change-me-marketplace}
      KEYCLOAK_SELLER_PORTAL_CLIENT_ID: ${KEYCLOAK_SELLER_PORTAL_CLIENT_ID:-msb-seller-portal}
      KEYCLOAK_SELLER_PORTAL_CLIENT_SECRET: ${KEYCLOAK_SELLER_PORTAL_CLIENT_SECRET:-local-dev-only-change-me-seller-portal}
      KEYCLOAK_ADMIN_PORTAL_CLIENT_ID: ${KEYCLOAK_ADMIN_PORTAL_CLIENT_ID:-msb-admin-portal}
      KEYCLOAK_ADMIN_PORTAL_CLIENT_SECRET: ${KEYCLOAK_ADMIN_PORTAL_CLIENT_SECRET:-local-dev-only-change-me-admin-portal}
      KEYCLOAK_GATEWAY_ADMIN_CLIENT_ID: ${KEYCLOAK_GATEWAY_ADMIN_CLIENT_ID:-msb-gateway-admin}
      KEYCLOAK_GATEWAY_ADMIN_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_ADMIN_CLIENT_SECRET:-local-dev-only-change-me-gateway-admin}
      JWT_SECRET: ${JWT_SECRET:-5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    depends_on:
      - product-service
      - chat-service
      - auth-service
      - keycloak
    restart: unless-stopped

  # ── Frontend (Angular → Nginx) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_CONFIGURATION: ${FRONTEND_BUILD_CONFIGURATION:-production}
    container_name: frontend
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
    restart: unless-stopped
