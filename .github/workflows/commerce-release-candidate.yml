name: V2 Commerce Release Candidate Gate

on:
  pull_request:
    branches: [dev, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-compose:
    name: Configuration, Compose, Secrets, Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate approved composition
        run: |
          docker compose -f docker-compose.demo.yml -f docker-compose.cart-runtime.yml config > /tmp/commerce-compose.yml
          grep -q 'COMMERCE_RUNTIME_PROFILE: V2_COMMERCE_RC_01' /tmp/commerce-compose.yml
          grep -q 'image: mysql:8.4' /tmp/commerce-compose.yml
          grep -q 'image: redis:7.4-alpine' /tmp/commerce-compose.yml
          grep -q 'FRONTEND_BUILD_CONFIGURATION: demo-checkout' /tmp/commerce-compose.yml
      - name: Secret pattern gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-(proj-)?[A-Za-z0-9_-]{24,}|AKIA[0-9A-Z]{16}'; then
            echo 'Potential committed credential detected.' >&2
            exit 1
          fi
      - name: Changed-file quality
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^
          fi

  clean-migrations-and-concurrency:
    name: MySQL 8.4 Migrations and Lifecycle Races
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Maven wrapper
        run: chmod +x ./mvnw
      - name: Clean schema gates
        shell: pwsh
        run: ./tools/verify-commerce-clean-migrations.ps1
      - name: Concurrency, replay, and idempotency gates
        shell: pwsh
        run: ./tools/verify-commerce-concurrency.ps1

  full-backend-regression:
    name: Full Commerce Backend Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install reactor artifacts without unrelated tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests install
      - name: Run Commerce service suites
        run: ./mvnw -B -pl inventory-service,order-service,payment-service,notification-service test
      - name: Run Commerce Gateway suites
        run: >-
          ./mvnw -B -pl api-gateway
          -Dtest=ApiGatewayApplicationTests,BusinessOrderRouteIntegrationTests,CartRouteIntegrationTests,NotificationDisabledRouteTests,NotificationRouteIntegrationTests,ReturnDisabledRouteTests
          test
      - name: Run Auth suite
        run: ./mvnw -B -pl auth-service test

  frontend-regression:
    name: Angular Tests and Commerce Builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Full Angular test suite
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Production build
        run: npm run build -- --configuration production
      - name: Demo commerce build
        run: npm run build:demo-checkout

  real-runtime-acceptance:
    name: Real Services, Recovery, and Accounting
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate runtime-only demo credentials
        shell: bash
        run: |
          set -euo pipefail
          keycloak_admin="RcAdmin-$(openssl rand -hex 18)"
          commerce_token="$(openssl rand -hex 32)"
          payment_token="$(openssl rand -hex 32)"
          buyer_a="RcBuyerA-$(openssl rand -hex 12)"
          buyer_b="RcBuyerB-$(openssl rand -hex 12)"
          harbor="RcHarbor-$(openssl rand -hex 12)"
          shen="RcShen-$(openssl rand -hex 12)"
          for value in "$keycloak_admin" "$commerce_token" "$payment_token" "$buyer_a" "$buyer_b" "$harbor" "$shen"; do
            echo "::add-mask::$value"
          done
          {
            echo "KEYCLOAK_ADMIN_PASSWORD=$keycloak_admin"
            echo "COMMERCE_INTERNAL_SERVICE_TOKEN=$commerce_token"
            echo "PAYMENT_INTERNAL_SERVICE_TOKEN=$payment_token"
            echo "LOCAL_DEMO_BUYER_PASSWORD=$buyer_a"
            echo "LOCAL_DEMO_BUYER_B_PASSWORD=$buyer_b"
            echo "LOCAL_DEMO_HARBOR_PASSWORD=$harbor"
            echo "LOCAL_DEMO_SHEN_PASSWORD=$shen"
          } >> "$GITHUB_ENV"
      - name: Package services
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package
      - name: Start the approved commerce runtime
        run: >-
          docker compose -f docker-compose.demo.yml -f docker-compose.cart-runtime.yml
          up -d --build --wait --wait-timeout 240
      - name: Preflight and deterministic fixtures
        shell: pwsh
        run: ./tools/prepare-commerce-demo.ps1
      - name: Journey A, Journey B, restart/recovery, and invariant gates
        shell: pwsh
        run: ./tools/run-commerce-rc.ps1 -SkipFixtures
      - name: Stop ephemeral runtime
        if: always()
        run: docker compose -f docker-compose.demo.yml -f docker-compose.cart-runtime.yml down -v
