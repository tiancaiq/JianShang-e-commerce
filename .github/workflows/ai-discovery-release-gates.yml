name: AI CS Discovery Integrated Release Gates

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-cs-discovery-integrated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Integrated Scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify integrated AI-CS plus discovery manifest
        run: |
          set -euo pipefail
          base="16a30ae38739ec28f011c63f017f22b9812d8822"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"..HEAD)"
          expected="$(printf '%s\n' \
            ".github/workflows/ai-discovery-release-gates.yml" \
            "agent-service/db/migration/V7__create_marketplace_discovery_sessions.sql" \
            "agent-service/evals/ai_disc_01c_offline_baseline_v1.json" \
            "agent-service/pyproject.toml" \
            "agent-service/src/msb_agent_service/agent_persistence.py" \
            "agent-service/src/msb_agent_service/api.py" \
            "agent-service/src/msb_agent_service/config.py" \
            "agent-service/src/msb_agent_service/discovery_api.py" \
            "agent-service/src/msb_agent_service/discovery_persistence.py" \
            "agent-service/src/msb_agent_service/marketplace_discovery.py" \
            "agent-service/src/msb_agent_service/marketplace_discovery_evaluation.py" \
            "agent-service/src/msb_agent_service/schemas.py" \
            "agent-service/tests/test_api.py" \
            "agent-service/tests/test_discovery_api.py" \
            "agent-service/tests/test_discovery_persistence_integration.py" \
            "agent-service/tests/test_marketplace_discovery.py" \
            "agent-service/tests/test_marketplace_discovery_evaluation.py" \
            "api-gateway/src/main/java/com/msb/ecom/api_gateway/routes/Routes.java" \
            "api-gateway/src/main/resources/application.properties" \
            "api-gateway/src/test/java/com/msb/ecom/api_gateway/AgentDiscoveryRouteIntegrationTests.java" \
            "docker-compose.demo.yml" \
            "docs/mvp/ai/ai-disc-01-agent-conversational-marketplace-discovery.md" \
            "frontend/angular.json" \
            "frontend/config/ai-build-config.test.mjs" \
            "frontend/src/app/app.routes.ts" \
            "frontend/src/app/features/agent/agent-customer-service-page.component.ts" \
            "frontend/src/app/features/agent/agent-customer-service.capability.ts" \
            "frontend/src/app/features/agent/agent-marketplace-discovery.component.spec.ts" \
            "frontend/src/app/features/agent/agent-marketplace-discovery.component.ts" \
            "frontend/src/app/features/agent/agent-marketplace-discovery.model.ts" \
            "frontend/src/app/features/agent/agent-marketplace-discovery.service.spec.ts" \
            "frontend/src/app/features/agent/agent-marketplace-discovery.service.ts" \
            "frontend/src/environments/environment.demo-ai-discovery.ts" \
            "frontend/src/environments/environment.demo-ai.ts" \
            "frontend/src/environments/environment.development.ts" \
            "frontend/src/environments/environment.ts")"
          test "$changed" = "$expected"
          git diff --check "$base"..HEAD
          test -z "$(git diff --name-only "$base"..HEAD -- '.env*' 'notification-service/**' 'order-service/**' 'product-service/**' 'payment-service/**' 'inventory-service/**' 'docs/v2/**' 'docker-compose.yml' 'docker-compose.prod.yml')"

  agent:
    name: Agent CS And Discovery Tests
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/pyproject.toml

      - name: Install locked agent service
        run: |
          set -euo pipefail
          grep -F '"langchain-core==1.4.9"' agent-service/pyproject.toml
          grep -F '"langchain==1.3.14"' agent-service/pyproject.toml
          python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          metadata = tomllib.loads(pathlib.Path("agent-service/pyproject.toml").read_text(encoding="utf-8"))
          dependencies = list(metadata["project"]["dependencies"])
          optional = metadata["project"].get("optional-dependencies", {})
          for values in optional.values():
              dependencies.extend(values)

          unconstrained = [
              dependency
              for dependency in dependencies
              if not re.search(r"(==|~=|>=|<=|>|<)", dependency)
          ]
          if unconstrained:
              print("Unconstrained direct dependencies:", unconstrained)
              sys.exit(1)
          print(f"direct_dependencies_checked={len(dependencies)}")
          PY
          python -m pip install -e "./agent-service[dev]"
          python -m pip check
          python - <<'PY'
          from importlib import metadata

          expected = {
              "langchain": "1.3.14",
              "langchain-core": "1.4.9",
          }
          for package, version in expected.items():
              actual = metadata.version(package)
              if actual != version:
                  raise SystemExit(f"{package} installed as {actual}, expected {version}")
          print("locked_dependency_versions_ok")
          PY
          test -z "${OPENAI_API_KEY:-}"

      - name: Run focused customer-service and discovery suites
        env:
          PYTHONPATH: agent-service/tests
        run: >-
          python -m unittest
          agent-service.tests.test_customer_service_api
          agent-service.tests.test_customer_service_runtime
          agent-service.tests.test_customer_service_langchain
          agent-service.tests.test_demo_activation_config
          agent-service.tests.test_discovery_api
          agent-service.tests.test_marketplace_discovery
          agent-service.tests.test_marketplace_discovery_evaluation
          -v

      - name: Run full agent suite
        env:
          PYTHONPATH: agent-service/tests
        run: python -m unittest discover -s agent-service/tests -v

      - name: Run deterministic evaluator and blocked release gate
        env:
          PYTHONPATH: agent-service/tests
        run: |
          set -euo pipefail
          python -m msb_agent_service.marketplace_discovery_evaluation \
            --fixture agent-service/evals/ai_disc_01c_offline_baseline_v1.json \
            --digest
          python -m unittest \
            agent-service.tests.test_marketplace_discovery_evaluation.MarketplaceDiscoveryEvaluationTest.test_report_passes_every_provisional_threshold_but_release_is_blocked \
            agent-service.tests.test_marketplace_discovery_evaluation.MarketplaceDiscoveryEvaluationTest.test_usage_is_zero_cost_and_latency_is_explicitly_non_production \
            -v

      - name: Require executable V7 discovery MySQL coverage
        env:
          PYTHONPATH: agent-service/tests
          RUN_MYSQL_INTEGRATION: "1"
        run: |
          set -euo pipefail
          if ! grep -RIl "agent_discovery_sessions\|DiscoverySession\|discovery_recommendations" agent-service/tests/*integration*.py; then
            echo "Missing executable discovery MySQL/Testcontainers persistence coverage."
            exit 1
          fi
          python -m unittest discover \
            -s agent-service/tests \
            -p "test_discovery_persistence_integration.py" \
            -v 2>&1 | tee /tmp/discovery-mysql.log
          if grep -E "skipped|OK \(skipped=" /tmp/discovery-mysql.log; then
            echo "Discovery MySQL suite must run with zero skips."
            exit 1
          fi

  gateway:
    name: Agent Gateway Route Tests
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run gateway focused and full tests
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -pl api-gateway -am -Dtest=AgentRouteIntegrationTests,AgentDiscoveryRouteIntegrationTests -Dsurefire.failIfNoSpecifiedTests=false test
          ./mvnw -B -pl api-gateway -am test
          ./mvnw -B -pl api-gateway -am package -DskipTests

  frontend:
    name: Agent Frontend Tests And Builds
    runs-on: ubuntu-latest
    needs: scope
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run focused customer-service and discovery tests
        run: >-
          npx ng test
          --watch=false
          --browsers=ChromeHeadless
          --include=src/app/features/agent/agent-customer-service-page.component.spec.ts
          --include=src/app/features/agent/agent-customer-service-thread.component.spec.ts
          --include=src/app/features/agent/agent-customer-service.service.spec.ts
          --include=src/app/features/agent/agent-marketplace-discovery.component.spec.ts
          --include=src/app/features/agent/agent-marketplace-discovery.service.spec.ts

      - name: Run AI build config default-off checks
        run: npm run test:ai-build-config

      - name: Run full frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production and demo AI
        run: |
          npm run build -- --configuration production
          npm run build -- --configuration demo-ai
          npm run build -- --configuration demo-ai-discovery

  safety:
    name: Integrated Safety Checks
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run architecture and safety checks
        run: |
          set -euo pipefail
          base="16a30ae38739ec28f011c63f017f22b9812d8822"
          base_arch="$(mktemp)"
          head_arch="$(mktemp)"
          if ! python tools/architecture_checks.py > "$head_arch" 2>&1; then
            :
          fi
          git checkout --quiet "$base"
          if ! python tools/architecture_checks.py > "$base_arch" 2>&1; then
            :
          fi
          git checkout --quiet -
          if ! diff -u "$base_arch" "$head_arch"; then
            echo "Architecture guardrail output changed from the deployed AI-CS base."
            exit 1
          fi
          python tools/architecture_checks.py --self-test
          git diff --check "$base"..HEAD
          test -z "$(git diff --name-only "$base"..HEAD -- 'agent-service/db/migration/V1__*' 'agent-service/db/migration/V2__*' 'agent-service/db/migration/V3__*' 'agent-service/db/migration/V4__*' 'agent-service/db/migration/V5__*' 'agent-service/db/migration/V6__*')"
          test -f agent-service/db/migration/V7__create_marketplace_discovery_sessions.sql
          test -f agent-service/src/msb_agent_service/customer_service_runtime.py
          test -f agent-service/src/msb_agent_service/customer_service_langchain.py
          grep -R "aiDiscovery: false" frontend/src/environments/environment.ts frontend/src/environments/environment.development.ts frontend/src/environments/environment.demo-ai.ts
          grep -R "aiDiscovery: true" frontend/src/environments/environment.demo-ai-discovery.ts
          grep -R "aiAssistant: false" frontend/src/environments/environment.ts frontend/src/environments/environment.development.ts
          grep -R "aiAssistant: true" frontend/src/environments/environment.demo-ai.ts
          grep -R "aiAssistant: true" frontend/src/environments/environment.demo-ai-discovery.ts
          grep -R "GATEWAY_FEATURE_AGENT_DISCOVERY:false" api-gateway/src/main/resources
          grep -R "GATEWAY_FEATURE_AGENT:false" api-gateway/src/main/resources
          grep -R "AGENT_DISCOVERY_API_ENABLED" agent-service/src/msb_agent_service/config.py
          grep -F "GATEWAY_FEATURE_AGENT_DISCOVERY: \${GATEWAY_FEATURE_AGENT_DISCOVERY:-false}" docker-compose.demo.yml
          grep -F "AGENT_DISCOVERY_API_ENABLED: \${AGENT_DISCOVERY_API_ENABLED:-false}" docker-compose.demo.yml
          grep -F "AGENT_DISCOVERY_KILL_SWITCH_ENABLED: \${AGENT_DISCOVERY_KILL_SWITCH_ENABLED:-false}" docker-compose.demo.yml
          grep -F "AGENT_DISCOVERY_ORCHESTRATION_ENABLED: \${AGENT_DISCOVERY_ORCHESTRATION_ENABLED:-false}" docker-compose.demo.yml
          grep -F "AGENT_DISCOVERY_PRODUCT_TOOLS_ENABLED: \${AGENT_DISCOVERY_PRODUCT_TOOLS_ENABLED:-false}" docker-compose.demo.yml
          grep -F "AGENT_DISCOVERY_PROVIDER_ENABLED: \${AGENT_DISCOVERY_PROVIDER_ENABLED:-false}" docker-compose.demo.yml
          grep -F "AGENT_CUSTOMER_SERVICE_API_ENABLED: \${AGENT_CUSTOMER_SERVICE_API_ENABLED:-false}" docker-compose.demo.yml
          grep -F "GATEWAY_FEATURE_AGENT: \${GATEWAY_FEATURE_AGENT:-false}" docker-compose.demo.yml
          grep -F "FRONTEND_BUILD_CONFIGURATION: \${FRONTEND_BUILD_CONFIGURATION:-production}" docker-compose.demo.yml
          test -z "$(grep -nE 'GATEWAY_FEATURE_NOTIFICATION|NOTIFICATION_|ORDER_SERVICE_ENABLED|LISTING_PROPOSAL' docker-compose.demo.yml || true)"
          pattern='(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----|ghp_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{22,}|sk_live_[A-Za-z0-9]{16,}|xox[baprs]-[A-Za-z0-9-]{20,})'
          if grep -RInE --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules --exclude=package-lock.json "$pattern" .; then
            exit 1
          fi
