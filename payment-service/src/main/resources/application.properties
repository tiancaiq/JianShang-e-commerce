spring.application.name=payment-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=8084
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}

# MySQL
spring.datasource.url=jdbc:mysql://${PAYMENT_DB_HOST:${MYSQL_HOST:localhost}}:${PAYMENT_DB_PORT:${MYSQL_PORT:3306}}/${PAYMENT_DB_NAME:payment_service}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${PAYMENT_DB_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Provider-neutral intents and the deterministic local demo completion remain independently opt-in.
payment.intents.enabled=${PAYMENT_INTENTS_ENABLED:false}
payment.internal-service-token=${PAYMENT_INTERNAL_SERVICE_TOKEN:}
payment.webhooks.enabled=${PAYMENT_WEBHOOKS_ENABLED:false}
payment.webhooks.fake.secret=${PAYMENT_FAKE_WEBHOOK_SECRET:}
payment.webhooks.signature-tolerance=${PAYMENT_WEBHOOK_SIGNATURE_TOLERANCE:PT5M}
payment.demo-completion.enabled=${PAYMENT_DEMO_COMPLETION_ENABLED:false}
payment.refunds.enabled=${PAYMENT_REFUNDS_ENABLED:false}

# The bounded local runtime can dispatch payment events to Order Service over an internal HTTP adapter.
payment.outbox.transport=${PAYMENT_OUTBOX_TRANSPORT:DISABLED}
service.order.url=${ORDER_SERVICE_URL:http://localhost:8081}
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8085}
commerce.internal-service-token=${COMMERCE_INTERNAL_SERVICE_TOKEN:}

# Payment events remain persisted but undispatched until an approved transport is configured.
payment.outbox.dispatch.enabled=${PAYMENT_OUTBOX_DISPATCH_ENABLED:false}
payment.outbox.dispatch.worker-enabled=${PAYMENT_OUTBOX_WORKER_ENABLED:false}
payment.outbox.dispatch.interval-ms=${PAYMENT_OUTBOX_INTERVAL_MS:1000}
payment.outbox.dispatch.batch-size=${PAYMENT_OUTBOX_BATCH_SIZE:25}
payment.outbox.dispatch.max-attempts=${PAYMENT_OUTBOX_MAX_ATTEMPTS:10}
payment.outbox.dispatch.claim-lease=${PAYMENT_OUTBOX_CLAIM_LEASE:PT30S}
payment.outbox.dispatch.initial-backoff=${PAYMENT_OUTBOX_INITIAL_BACKOFF:PT5S}
payment.outbox.dispatch.max-backoff=${PAYMENT_OUTBOX_MAX_BACKOFF:PT5M}
