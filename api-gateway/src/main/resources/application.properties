spring.application.name=api-gateway
server.port=9000

# Service URLs (swap to lb:// URIs when using service discovery)
service.product.url=${PRODUCT_SERVICE_URL:http://localhost:8091}
service.chat.url=${CHAT_SERVICE_URL:http://localhost:8092}
service.order.url=${ORDER_SERVICE_URL:http://localhost:8081}
service.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
service.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8085}
service.agent.url=${AGENT_SERVICE_URL:http://localhost:8086}
service.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}

# Deferred capabilities register no gateway route unless explicitly enabled.
msb.gateway.features.agent=${GATEWAY_FEATURE_AGENT:false}
msb.gateway.features.category-guidance=${GATEWAY_FEATURE_CATEGORY_GUIDANCE:false}
msb.gateway.features.cart-checkout=${GATEWAY_FEATURE_CART_CHECKOUT:false}
msb.gateway.features.inventory=${GATEWAY_FEATURE_INVENTORY:false}
msb.gateway.features.buyer-addresses=${GATEWAY_FEATURE_BUYER_ADDRESSES:false}
msb.gateway.features.payment=${GATEWAY_FEATURE_PAYMENT:false}
msb.gateway.features.business-orders=${GATEWAY_FEATURE_BUSINESS_ORDERS:false}
msb.gateway.features.notifications=${GATEWAY_FEATURE_NOTIFICATIONS:false}

# Gateway BFF session and browser policy
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${GATEWAY_SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${GATEWAY_SESSION_TIMEOUT:30m}
msb.gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Absolute marketplace URL used after browser logout. Override in VM deployments.
msb.gateway.auth.logout-redirect-uri=${GATEWAY_LOGOUT_REDIRECT_URI:http://localhost:4200/}
msb.gateway.auth.login-success-base-uri=${GATEWAY_LOGIN_SUCCESS_BASE_URI:http://localhost:4200}
msb.gateway.auth.oidc-logout-uri=${KEYCLOAK_BROWSER_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}}/protocol/openid-connect/logout
msb.gateway.auth.keycloak-admin-base-uri=${KEYCLOAK_BACKCHANNEL_BASE_URI:http://localhost:8181}
msb.gateway.auth.keycloak-realm=${KEYCLOAK_REALM:msb-local}
msb.gateway.auth.admin-client-id=${KEYCLOAK_GATEWAY_ADMIN_CLIENT_ID:msb-gateway-admin}
msb.gateway.auth.admin-client-secret=${KEYCLOAK_GATEWAY_ADMIN_CLIENT_SECRET:local-dev-only-change-me-gateway-admin}

# Keycloak OIDC BFF and resource-server validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_BROWSER_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}}
spring.security.oauth2.client.provider.msb-local.authorization-uri=${KEYCLOAK_BROWSER_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.msb-local.token-uri=${KEYCLOAK_BACKCHANNEL_ISSUER_URI:${KEYCLOAK_BROWSER_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}}}/protocol/openid-connect/token
spring.security.oauth2.client.provider.msb-local.jwk-set-uri=${KEYCLOAK_BACKCHANNEL_ISSUER_URI:${KEYCLOAK_BROWSER_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}}}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.msb-local.user-name-attribute=sub
spring.security.oauth2.client.registration.marketplace.provider=msb-local
spring.security.oauth2.client.registration.marketplace.client-id=${KEYCLOAK_MARKETPLACE_CLIENT_ID:msb-marketplace}
spring.security.oauth2.client.registration.marketplace.client-secret=${KEYCLOAK_MARKETPLACE_CLIENT_SECRET:local-dev-only-change-me-marketplace}
spring.security.oauth2.client.registration.marketplace.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.marketplace.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.marketplace.redirect-uri={baseUrl}/api/v1/auth/callback/{registrationId}
spring.security.oauth2.client.registration.marketplace.scope=openid,profile,email,roles
spring.security.oauth2.client.registration.seller-portal.provider=msb-local
spring.security.oauth2.client.registration.seller-portal.client-id=${KEYCLOAK_SELLER_PORTAL_CLIENT_ID:msb-seller-portal}
spring.security.oauth2.client.registration.seller-portal.client-secret=${KEYCLOAK_SELLER_PORTAL_CLIENT_SECRET:local-dev-only-change-me-seller-portal}
spring.security.oauth2.client.registration.seller-portal.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.seller-portal.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.seller-portal.redirect-uri={baseUrl}/api/v1/auth/callback/{registrationId}
spring.security.oauth2.client.registration.seller-portal.scope=openid,profile,email,roles
spring.security.oauth2.client.registration.admin-portal.provider=msb-local
spring.security.oauth2.client.registration.admin-portal.client-id=${KEYCLOAK_ADMIN_PORTAL_CLIENT_ID:msb-admin-portal}
spring.security.oauth2.client.registration.admin-portal.client-secret=${KEYCLOAK_ADMIN_PORTAL_CLIENT_SECRET:local-dev-only-change-me-admin-portal}
spring.security.oauth2.client.registration.admin-portal.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.admin-portal.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.admin-portal.redirect-uri={baseUrl}/api/v1/auth/callback/{registrationId}
spring.security.oauth2.client.registration.admin-portal.scope=openid,profile,email,roles

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

# Resilience4j Timeout / TimeLimiter
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.instances.authServiceCircuitBreaker.timeout-duration=30s
resilience4j.timelimiter.instances.publicAuthServiceCircuitBreaker.timeout-duration=30s

# Resilience4j Retry
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=2s

# Actuator
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
