spring.application.name=order-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://${ORDER_DB_HOST:${MYSQL_HOST:localhost}}:${ORDER_DB_PORT:${MYSQL_PORT:3306}}/${ORDER_DB_NAME:js_order}
spring.datasource.username=${ORDER_DB_USERNAME:root}
spring.datasource.password=${ORDER_DB_PASSWORD:${MYSQL_ROOT_PASSWORD:local-dev-only-change-me}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
