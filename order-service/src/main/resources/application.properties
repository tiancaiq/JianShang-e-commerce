spring.application.name=order-service
spring.config.import=optional:file:.env.demo[.properties],optional:file:../.env.demo[.properties],optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
server.port=8081

# MySQL checkout store
spring.datasource.url=jdbc:mysql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:${MYSQL_PORT:3306}}/${ORDER_DB_NAME:order_service}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${ORDER_DB_USERNAME:root}
spring.datasource.password=${ORDER_DB_PASSWORD:${MYSQL_ROOT_PASSWORD:mysql}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true

# Redis cart store
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Keycloak resource server validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}

# Commerce dependencies
service.product.url=${PRODUCT_SERVICE_URL:http://localhost:8091}
service.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8085}
commerce.internal-service-token=${COMMERCE_INTERNAL_SERVICE_TOKEN:local-commerce-service-token}
service.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
service.payment.internal-service-token=${PAYMENT_INTERNAL_SERVICE_TOKEN:}

# Cart policy
cart.ttl=${CART_TTL:30d}
cart.max-items=${CART_MAX_ITEMS:50}
cart.max-quantity=${CART_MAX_QUANTITY:999}

# V2 checkout remains opt-in and local-demo only.
checkout.enabled=${CHECKOUT_ENABLED:false}
checkout.calculation-mode=${CHECKOUT_CALCULATION_MODE:LOCAL_DEMO}
checkout.tax-adapter=${CHECKOUT_TAX_ADAPTER:ZERO_LOCAL_DEMO_V1}
checkout.shipping-adapter=${CHECKOUT_SHIPPING_ADAPTER:FREE_LOCAL_DEMO_V1}
checkout.policy-version=${CHECKOUT_POLICY_VERSION:LOCAL_DEMO_V1}
checkout.session-lifetime=${CHECKOUT_SESSION_LIFETIME:PT15M}
checkout.expiry-worker-enabled=${CHECKOUT_EXPIRY_WORKER_ENABLED:true}
checkout.expiry-interval-ms=${CHECKOUT_EXPIRY_INTERVAL_MS:5000}
checkout.expiry-batch-size=${CHECKOUT_EXPIRY_BATCH_SIZE:50}
checkout.recovery-interval-ms=${CHECKOUT_RECOVERY_INTERVAL_MS:5000}
checkout.recovery-batch-size=${CHECKOUT_RECOVERY_BATCH_SIZE:50}
checkout.idempotency-retention=${CHECKOUT_IDEMPOTENCY_RETENTION:P7D}

# Checkout-to-payment remains independently opt-in and makes no automatic retries.
checkout.payment-integration.enabled=${CHECKOUT_PAYMENT_INTEGRATION_ENABLED:false}
checkout.payment-integration.connect-timeout=${CHECKOUT_PAYMENT_CONNECT_TIMEOUT:PT2S}
checkout.payment-integration.read-timeout=${CHECKOUT_PAYMENT_READ_TIMEOUT:PT3S}

# Payment event consumption remains disabled and has no live transport adapter.
order.confirmation.enabled=${ORDER_CONFIRMATION_ENABLED:false}
order.confirmation.consumer-name=${ORDER_CONFIRMATION_CONSUMER_NAME:order-service-order-confirmation-v1}
order.confirmation.processing-lease=${ORDER_CONFIRMATION_PROCESSING_LEASE:PT30S}

# Buyer order history/detail remains independently opt-in until its release gate.
order.buyer-views.enabled=${ORDER_BUYER_VIEWS_ENABLED:false}

# Business fulfillment queue/detail remains independently opt-in until its release gate.
order.business-views.enabled=${ORDER_BUSINESS_VIEWS_ENABLED:false}

# Paid business fulfillment-group acceptance remains independently default-off.
business-orders.acceptance-enabled=${BUSINESS_ORDERS_ACCEPTANCE_ENABLED:false}
business-orders.processing-enabled=${BUSINESS_ORDERS_PROCESSING_ENABLED:false}
business-orders.manual-shipment-enabled=${BUSINESS_ORDERS_MANUAL_SHIPMENT_ENABLED:false}
business-orders.demo-delivery-enabled=${BUSINESS_ORDERS_DEMO_DELIVERY_ENABLED:false}

# The local-demo cancellation decision and compensation worker remains independently opt-in.
order.cancellation-processing.enabled=${ORDER_CANCELLATION_PROCESSING_ENABLED:false}
order.cancellation-processing.interval-ms=${ORDER_CANCELLATION_PROCESSING_INTERVAL_MS:500}
order.cancellation-processing.batch-size=${ORDER_CANCELLATION_PROCESSING_BATCH_SIZE:25}
order.cancellation-processing.retry-delay=${ORDER_CANCELLATION_PROCESSING_RETRY_DELAY:PT2S}

management.endpoints.web.exposure.include=health,metrics
logging.level.com.msb.ecom.order_service=INFO

# Retryable local-demo delivery of existing authoritative outbox events to Notification Service.
order.notification-outbox.enabled=${ORDER_NOTIFICATION_OUTBOX_ENABLED:false}
order.notification-outbox.worker-enabled=${ORDER_NOTIFICATION_OUTBOX_WORKER_ENABLED:false}
order.notification-outbox.interval-ms=${ORDER_NOTIFICATION_OUTBOX_INTERVAL_MS:500}
order.notification-outbox.batch-size=${ORDER_NOTIFICATION_OUTBOX_BATCH_SIZE:25}
order.notification-outbox.retry-delay=${ORDER_NOTIFICATION_OUTBOX_RETRY_DELAY:PT2S}
business-orders.returns-enabled=${BUSINESS_ORDERS_RETURNS_ENABLED:false}
business-orders.return-processing-enabled=${BUSINESS_ORDERS_RETURN_PROCESSING_ENABLED:false}
business-orders.return-window=${BUSINESS_ORDERS_RETURN_WINDOW:P30D}
business-orders.return-retry-delay=${BUSINESS_ORDERS_RETURN_RETRY_DELAY:PT2S}
business-orders.return-batch-size=${BUSINESS_ORDERS_RETURN_BATCH_SIZE:20}
business-orders.return-worker-interval-ms=${BUSINESS_ORDERS_RETURN_WORKER_INTERVAL_MS:500}
service.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}
