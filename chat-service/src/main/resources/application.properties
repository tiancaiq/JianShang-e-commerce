spring.application.name=chat-service
spring.config.import=optional:file:.env.demo[.properties],optional:file:../.env.demo[.properties],optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
server.port=8092

# MySQL chat schema
spring.datasource.url=jdbc:mysql://${CHAT_DB_HOST:localhost}:${CHAT_DB_PORT:${MYSQL_PORT:3306}}/${CHAT_DB_NAME:chat}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${CHAT_DB_USERNAME:root}
spring.datasource.password=${CHAT_DB_PASSWORD:${MYSQL_ROOT_PASSWORD:mysql}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/chat

# Keycloak resource server validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_BACKCHANNEL_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}}/protocol/openid-connect/certs}

# Service URLs
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8085}
service.product.url=${PRODUCT_SERVICE_URL:http://localhost:8091}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
