spring.application.name=auth-service
spring.config.import=optional:file:.env.demo[.properties],optional:file:../.env.demo[.properties],optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
server.port=${AUTH_SERVICE_PORT:8085}

# MySQL identity schema
spring.datasource.url=jdbc:mysql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:${MYSQL_PORT:3306}}/${IDENTITY_DB_NAME:identity}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${IDENTITY_DB_USERNAME:root}
spring.datasource.password=${IDENTITY_DB_PASSWORD:${MYSQL_ROOT_PASSWORD:mysql}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/identity

# Keycloak resource server validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}

# Business verification webhook
business.verification.webhook-secret=${BUSINESS_VERIFICATION_WEBHOOK_SECRET:local-business-verification-secret}
commerce.internal-service-token=${COMMERCE_INTERNAL_SERVICE_TOKEN:local-commerce-service-token}
demo.cart-second-business-fixture.enabled=${CART_DEMO_SECOND_BUSINESS_FIXTURE_ENABLED:false}

# User avatars
user.avatar.storage=${USER_AVATAR_STORAGE:local-demo}
user.avatar.storage-dir=${USER_AVATAR_STORAGE_DIR:${user.dir}/data/auth-avatars}
user.avatar.max-size-bytes=${USER_AVATAR_MAX_SIZE_BYTES:5242880}
user.avatar.signed-url-ttl=${USER_AVATAR_SIGNED_URL_TTL:${LISTING_MEDIA_SIGNED_URL_TTL:PT15M}}
user.avatar.s3.endpoint-url=${USER_AVATAR_S3_ENDPOINT_URL:${S3_ENDPOINT_URL:}}
user.avatar.s3.region=${USER_AVATAR_S3_REGION:${S3_REGION:us-east-1}}
user.avatar.s3.bucket=${USER_AVATAR_S3_BUCKET:${S3_BUCKET:listing-media-local}}
user.avatar.s3.access-key-id=${USER_AVATAR_S3_ACCESS_KEY_ID:${S3_ACCESS_KEY_ID:}}
user.avatar.s3.secret-access-key=${USER_AVATAR_S3_SECRET_ACCESS_KEY:${S3_SECRET_ACCESS_KEY:}}
user.avatar.s3.path-style-access=${USER_AVATAR_S3_PATH_STYLE_ACCESS:${S3_PATH_STYLE_ACCESS:true}}

# Logging
logging.level.com.msb.ecom.auth_service=DEBUG
