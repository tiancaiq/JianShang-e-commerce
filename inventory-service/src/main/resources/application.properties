spring.application.name=inventory-service
spring.config.import=optional:file:.env.demo[.properties],optional:file:../.env.demo[.properties],optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
server.port=8082

# MySQL inventory schema
spring.datasource.url=jdbc:mysql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:${MYSQL_PORT:3306}}/${INVENTORY_DB_NAME:inventory_service}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${INVENTORY_DB_USERNAME:root}
spring.datasource.password=${INVENTORY_DB_PASSWORD:${MYSQL_ROOT_PASSWORD:mysql}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Keycloak resource server validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}

# Service dependencies
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8085}
service.product.url=${PRODUCT_SERVICE_URL:http://localhost:8091}
commerce.internal-service-token=${COMMERCE_INTERNAL_SERVICE_TOKEN:local-commerce-service-token}

# Reservation lifecycle
inventory.reservations.max-lifetime=${INVENTORY_RESERVATION_MAX_LIFETIME:PT24H}
inventory.reservations.expiry-enabled=${INVENTORY_RESERVATION_EXPIRY_ENABLED:true}
inventory.reservations.expiry-interval-ms=${INVENTORY_RESERVATION_EXPIRY_INTERVAL_MS:5000}
inventory.reservations.expiry-batch-size=${INVENTORY_RESERVATION_EXPIRY_BATCH_SIZE:50}
inventory.cancellation-restock.enabled=${INVENTORY_CANCELLATION_RESTOCK_ENABLED:false}
inventory.return-restock-enabled=${INVENTORY_RETURN_RESTOCK_ENABLED:false}

logging.level.com.msb.ecom.inventory_service=INFO
