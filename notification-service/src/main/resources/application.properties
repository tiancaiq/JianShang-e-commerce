spring.application.name=notification-service
server.port=8083

# Notification-owned MySQL schema. Root-backed local/demo runtimes may bootstrap
# the owned database before Flyway applies its forward-only migrations.
spring.datasource.url=jdbc:mysql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:3306}/${NOTIFICATION_DB_NAME:notification_service}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${NOTIFICATION_DB_USERNAME:root}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=${NOTIFICATION_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration/notifications

# Direct/fake consumption is the only NOT-01A boundary and remains disabled by default.
notifications.order-confirmed.enabled=${NOTIFICATION_ORDER_CONFIRMED_ENABLED:false}
notifications.order-confirmed.consumer-name=notification-service-order-confirmed-v2
notifications.order-confirmed.retention=P180D
notifications.order-confirmed.purge-enabled=false

# Authenticated reads remain local-only and unavailable until an explicit later activation.
notifications.read-api.enabled=${NOTIFICATION_READ_API_ENABLED:false}
notifications.read-api.auth-service-url=${SERVICE_AUTH_URL:http://localhost:8081}
notifications.read-api.connect-timeout=PT2S
notifications.read-api.read-timeout=PT3S

# Bounded local-demo commerce transport. Email, SMS, push, and WebSocket delivery remain absent.
notifications.commerce-events.enabled=${NOTIFICATION_COMMERCE_EVENTS_ENABLED:false}
notifications.commerce-events.internal-service-token=${COMMERCE_INTERNAL_SERVICE_TOKEN:}
notifications.commerce-events.consumer-name=notification-service-commerce-v1
notifications.commerce-events.retention=P180D
