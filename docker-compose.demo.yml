services:
  mongo:
    image: mongo:7.0.5
    container_name: msb-demo-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:-demo-change-me-mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-product-service}
    volumes:
      - demo_mongo_data:/data/db
    restart: unless-stopped

  mysql:
    image: mysql:8.3.0
    container_name: msb-demo-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo-change-me-mysql}
      MYSQL_DATABASE: ${IDENTITY_DB_NAME:-identity}
    volumes:
      - demo_mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  postgres-keycloak:
    image: postgres:15
    container_name: msb-demo-postgres-keycloak
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-change-me-keycloak-db}
    volumes:
      - demo_postgres_keycloak_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: msb-demo-keycloak
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_BASE_URI:-http://localhost:8181}
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-demo-change-me-keycloak-db}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-change-me-admin}
      KEYCLOAK_GOOGLE_CLIENT_ID: ${KEYCLOAK_GOOGLE_CLIENT_ID:-}
      KEYCLOAK_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:-}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8181}:8080"
    volumes:
      - ./infra/keycloak/realm-msb-local.json:/opt/keycloak/data/import/realm-msb-local.json:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      - postgres-keycloak
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: msb-demo-auth-service
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${IDENTITY_DB_NAME:-identity}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-demo-change-me-mysql}}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_BROWSER_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/msb-local/protocol/openid-connect/certs}
      BUSINESS_VERIFICATION_WEBHOOK_SECRET: ${BUSINESS_VERIFICATION_WEBHOOK_SECRET:-demo-change-me-business-webhook}
      PRODUCT_SERVICE_URL: http://product-service:8091
      GATEWAY_SERVICE_URL: http://api-gateway:9000
      CHAT_SERVICE_URL: http://chat-service:8092
      USER_AVATAR_STORAGE: ${USER_AVATAR_STORAGE:-${LISTING_MEDIA_STORAGE:-local-demo}}
      LISTING_MEDIA_STORAGE: ${LISTING_MEDIA_STORAGE:-local-demo}
      LISTING_MEDIA_SIGNED_URL_TTL: ${LISTING_MEDIA_SIGNED_URL_TTL:-PT15M}
      USER_AVATAR_MAX_SIZE_BYTES: ${USER_AVATAR_MAX_SIZE_BYTES:-5242880}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-listing-media-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
    depends_on:
      - mysql
      - keycloak
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: msb-demo-product-service
    ports:
      - "127.0.0.1:${PRODUCT_SERVICE_PORT:-8091}:8091"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_DB_USERNAME:-root}:${MONGO_DB_PASSWORD:-demo-change-me-mongo}@mongo:27017/${MONGO_DB_NAME:-product-service}?authSource=admin
      CATALOG_DB_HOST: mysql
      CATALOG_DB_PORT: 3306
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-root}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-demo-change-me-mysql}}
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:29092}
      LISTING_KNOWLEDGE_PUBLISHER_ENABLED: ${LISTING_KNOWLEDGE_PUBLISHER_ENABLED:-true}
      LISTING_KNOWLEDGE_EVENT_TOPIC: ${LISTING_KNOWLEDGE_EVENT_TOPIC:-listing-knowledge-v1}
      CATEGORY_GUIDANCE_EVENT_TOPIC: ${CATEGORY_GUIDANCE_EVENT_TOPIC:-category-guidance-v1}
      AGENT_INTERNAL_SERVICE_TOKEN: ${AGENT_INTERNAL_SERVICE_TOKEN:-local-agent-service-token}
      LISTING_SEARCH_ENGINE: ${LISTING_SEARCH_ENGINE:-mysql}
      OPENSEARCH_URL: http://agent-opensearch:9200
      OPENSEARCH_LISTING_INDEX: ${OPENSEARCH_LISTING_INDEX:-marketplace-listings}
      OPENSEARCH_LISTING_PHYSICAL_INDEX: ${OPENSEARCH_LISTING_PHYSICAL_INDEX:-marketplace-listings-v1}
      OPENSEARCH_INITIALIZE_INDEX: ${OPENSEARCH_INITIALIZE_INDEX:-true}
      LISTING_SEARCH_HYBRID_ENABLED: ${LISTING_SEARCH_HYBRID_ENABLED:-false}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_BROWSER_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/msb-local/protocol/openid-connect/certs}
      AUTH_SERVICE_URL: http://auth-service:8085
      LISTING_MEDIA_STORAGE: ${LISTING_MEDIA_STORAGE:-local-demo}
      LISTING_MEDIA_MAX_IMAGE_SIZE_BYTES: ${LISTING_MEDIA_MAX_IMAGE_SIZE_BYTES:-10485760}
      LISTING_MEDIA_SIGNED_URL_TTL: ${LISTING_MEDIA_SIGNED_URL_TTL:-PT15M}
      LISTING_MEDIA_HEALTH_CHECK_OBJECT_KEY: ${LISTING_MEDIA_HEALTH_CHECK_OBJECT_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-listing-media-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
    depends_on:
      - mongo
      - mysql
      - keycloak
      - auth-service
    restart: unless-stopped

  agent-migrations:
    image: redgate/flyway:12.11.0
    profiles:
      - ai
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${AGENT_MYSQL_DATABASE:-agent}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${AGENT_MYSQL_USERNAME:-root}
      FLYWAY_PASSWORD: ${AGENT_MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-demo-change-me-mysql}}
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./agent-service/db/migration:/flyway/sql:ro
    depends_on:
      - mysql
    restart: "no"

  agent-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: agent-zookeeper
    container_name: msb-demo-agent-zookeeper
    profiles:
      - ai
    ports:
      - "127.0.0.1:2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 30"]
      interval: 5s
      timeout: 35s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: msb-demo-agent-broker
    profiles:
      - ai
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    depends_on:
      agent-zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "agent-zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 30"]
      interval: 5s
      timeout: 35s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  agent-opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: msb-demo-agent-opensearch
    profiles:
      - ai
      - ai-bootstrap
    ports:
      - "127.0.0.1:${AGENT_OPENSEARCH_PORT:-9201}:9200"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${AGENT_OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          http://localhost:9200/_cluster/health?wait_for_status=yellow
          > /dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    volumes:
      - demo_agent_opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  agent-index-bootstrap:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    profiles:
      - ai-bootstrap
    entrypoint:
      - msb-knowledge-index
    command:
      - bootstrap
    environment:
      AGENT_KNOWLEDGE_ENABLED: ${AGENT_KNOWLEDGE_ENABLED:-false}
      AGENT_OPENSEARCH_URL: http://agent-opensearch:9200
      AGENT_OPENSEARCH_VERIFY_CERTS: "false"
      AGENT_KNOWLEDGE_EMBEDDING_PROVIDER: openai
      AGENT_KNOWLEDGE_EMBEDDING_MODEL: text-embedding-3-small
      AGENT_KNOWLEDGE_EMBEDDING_DIMENSIONS: 1536
    depends_on:
      agent-opensearch:
        condition: service_healthy
    restart: "no"

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: msb-demo-agent-service
    profiles:
      - ai
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8086}:8086"
    environment:
      PORT: 8086
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      AGENT_KNOWLEDGE_ENABLED: ${AGENT_KNOWLEDGE_ENABLED:-false}
      AGENT_OPENSEARCH_URL: http://agent-opensearch:9200
      AGENT_OPENSEARCH_VERIFY_CERTS: "false"
      AGENT_KNOWLEDGE_EMBEDDING_PROVIDER: openai
      AGENT_KNOWLEDGE_EMBEDDING_MODEL: text-embedding-3-small
      AGENT_KNOWLEDGE_EMBEDDING_DIMENSIONS: 1536
      AGENT_KNOWLEDGE_INGESTION_ENABLED: ${AGENT_KNOWLEDGE_INGESTION_ENABLED:-false}
      AGENT_KNOWLEDGE_PROCESSOR_ENABLED: ${AGENT_KNOWLEDGE_PROCESSOR_ENABLED:-false}
      AGENT_MYSQL_HOST: mysql
      AGENT_MYSQL_PORT: 3306
      AGENT_MYSQL_DATABASE: ${AGENT_MYSQL_DATABASE:-agent}
      AGENT_MYSQL_USERNAME: ${AGENT_MYSQL_USERNAME:-root}
      AGENT_MYSQL_PASSWORD: ${AGENT_MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-demo-change-me-mysql}}
      AGENT_PERSISTENCE_ENABLED: ${AGENT_PERSISTENCE_ENABLED:-false}
      AGENT_CUSTOMER_SERVICE_API_ENABLED: ${AGENT_CUSTOMER_SERVICE_API_ENABLED:-false}
      AGENT_CUSTOMER_SERVICE_KILL_SWITCH_ENABLED: ${AGENT_CUSTOMER_SERVICE_KILL_SWITCH_ENABLED:-false}
      AGENT_CUSTOMER_SERVICE_ORCHESTRATION_ENABLED: ${AGENT_CUSTOMER_SERVICE_ORCHESTRATION_ENABLED:-false}
      AGENT_CUSTOMER_SERVICE_RETRIEVAL_ENABLED: ${AGENT_CUSTOMER_SERVICE_RETRIEVAL_ENABLED:-false}
      AGENT_CUSTOMER_SERVICE_PROVIDER_ENABLED: ${AGENT_CUSTOMER_SERVICE_PROVIDER_ENABLED:-false}
      AGENT_DISCOVERY_API_ENABLED: ${AGENT_DISCOVERY_API_ENABLED:-false}
      AGENT_DISCOVERY_KILL_SWITCH_ENABLED: ${AGENT_DISCOVERY_KILL_SWITCH_ENABLED:-false}
      AGENT_DISCOVERY_ORCHESTRATION_ENABLED: ${AGENT_DISCOVERY_ORCHESTRATION_ENABLED:-false}
      AGENT_DISCOVERY_PRODUCT_TOOLS_ENABLED: ${AGENT_DISCOVERY_PRODUCT_TOOLS_ENABLED:-false}
      AGENT_DISCOVERY_HYBRID_RETRIEVAL_ENABLED: ${AGENT_DISCOVERY_HYBRID_RETRIEVAL_ENABLED:-false}
      AGENT_DISCOVERY_PROVIDER_ENABLED: ${AGENT_DISCOVERY_PROVIDER_ENABLED:-false}
      AGENT_MARKETPLACE_V2_API_ENABLED: ${AGENT_MARKETPLACE_V2_API_ENABLED:-false}
      AGENT_MARKETPLACE_V2_KILL_SWITCH_ENABLED: ${AGENT_MARKETPLACE_V2_KILL_SWITCH_ENABLED:-false}
      AGENT_MARKETPLACE_V2_PROVIDER_ENABLED: ${AGENT_MARKETPLACE_V2_PROVIDER_ENABLED:-false}
      AGENT_MARKETPLACE_V2_PRODUCT_TOOLS_ENABLED: ${AGENT_MARKETPLACE_V2_PRODUCT_TOOLS_ENABLED:-false}
      AGENT_MARKETPLACE_V2_HYBRID_RETRIEVAL_ENABLED: ${AGENT_MARKETPLACE_V2_HYBRID_RETRIEVAL_ENABLED:-false}
      AGENT_MARKETPLACE_V2_QUERY_EMBEDDING_ENABLED: ${AGENT_MARKETPLACE_V2_QUERY_EMBEDDING_ENABLED:-false}
      AUTH_SERVICE_URL: http://auth-service:8085
      AGENT_MESSAGE_RETENTION_DAYS: ${AGENT_MESSAGE_RETENTION_DAYS:-90}
      AGENT_AUDIT_RETENTION_DAYS: ${AGENT_AUDIT_RETENTION_DAYS:-365}
      AGENT_KAFKA_BOOTSTRAP_SERVERS: ${AGENT_KAFKA_BOOTSTRAP_SERVERS:-broker:29092}
      AGENT_KAFKA_TOPIC: ${AGENT_KAFKA_TOPIC:-listing-knowledge-v1}
      AGENT_KAFKA_GROUP_ID: ${AGENT_KAFKA_GROUP_ID:-msb-agent-listing-knowledge-v1}
      AGENT_KAFKA_CLIENT_ID: ${AGENT_KAFKA_CLIENT_ID:-msb-agent-service}
      AGENT_CATEGORY_GUIDANCE_INTAKE_ENABLED: ${AGENT_CATEGORY_GUIDANCE_INTAKE_ENABLED:-false}
      AGENT_CATEGORY_GUIDANCE_KAFKA_TOPIC: ${AGENT_CATEGORY_GUIDANCE_KAFKA_TOPIC:-category-guidance-v1}
      AGENT_CATEGORY_GUIDANCE_KAFKA_GROUP_ID: ${AGENT_CATEGORY_GUIDANCE_KAFKA_GROUP_ID:-msb-agent-category-guidance-v1}
      AGENT_CATEGORY_GUIDANCE_PROCESSING_ENABLED: ${AGENT_CATEGORY_GUIDANCE_PROCESSING_ENABLED:-false}
      AGENT_CATEGORY_GUIDANCE_RETRIEVAL_ENABLED: ${AGENT_CATEGORY_GUIDANCE_RETRIEVAL_ENABLED:-false}
      AGENT_PRODUCT_SERVICE_URL: http://product-service:8091
      AGENT_PRODUCT_SERVICE_TOKEN: ${AGENT_INTERNAL_SERVICE_TOKEN:-local-agent-service-token}
    depends_on:
      mysql:
        condition: service_started
      product-service:
        condition: service_healthy
      agent-migrations:
        condition: service_completed_successfully
      agent-opensearch:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: msb-demo-chat-service
    ports:
      - "127.0.0.1:${CHAT_SERVICE_PORT:-8092}:8092"
    environment:
      CHAT_DB_HOST: mysql
      CHAT_DB_PORT: 3306
      CHAT_DB_NAME: ${CHAT_DB_NAME:-chat}
      CHAT_DB_USERNAME: ${CHAT_DB_USERNAME:-root}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-demo-change-me-mysql}}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_BROWSER_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/msb-local/protocol/openid-connect/certs}
      AUTH_SERVICE_URL: http://auth-service:8085
      PRODUCT_SERVICE_URL: http://product-service:8091
    depends_on:
      - mysql
      - keycloak
      - auth-service
      - product-service
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: msb-demo-api-gateway
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-9000}:9000"
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PRODUCT_SERVICE_URL: http://product-service:8091
      CHAT_SERVICE_URL: http://chat-service:8092
      AUTH_SERVICE_URL: http://auth-service:8085
      AGENT_SERVICE_URL: http://agent-service:8086
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service-disabled:8081}
      INVENTORY_SERVICE_URL: http://inventory-service-disabled:8082
      PAYMENT_SERVICE_URL: http://payment-service-disabled:8084
      GATEWAY_FEATURE_AGENT: ${GATEWAY_FEATURE_AGENT:-false}
      GATEWAY_FEATURE_AGENT_DISCOVERY: ${GATEWAY_FEATURE_AGENT_DISCOVERY:-false}
      GATEWAY_FEATURE_CART: ${GATEWAY_FEATURE_CART:-false}
      KEYCLOAK_BROWSER_ISSUER_URI: ${KEYCLOAK_BROWSER_ISSUER_URI:-http://localhost:8181/realms/msb-local}
      KEYCLOAK_BACKCHANNEL_BASE_URI: ${KEYCLOAK_BACKCHANNEL_BASE_URI:-http://keycloak:8080}
      KEYCLOAK_BACKCHANNEL_ISSUER_URI: ${KEYCLOAK_BACKCHANNEL_ISSUER_URI:-http://keycloak:8080/realms/msb-local}
      KEYCLOAK_MARKETPLACE_CLIENT_ID: ${KEYCLOAK_MARKETPLACE_CLIENT_ID:-msb-marketplace}
      KEYCLOAK_MARKETPLACE_CLIENT_SECRET: ${KEYCLOAK_MARKETPLACE_CLIENT_SECRET:-local-dev-only-change-me-marketplace}
      KEYCLOAK_SELLER_PORTAL_CLIENT_ID: ${KEYCLOAK_SELLER_PORTAL_CLIENT_ID:-msb-seller-portal}
      KEYCLOAK_SELLER_PORTAL_CLIENT_SECRET: ${KEYCLOAK_SELLER_PORTAL_CLIENT_SECRET:-local-dev-only-change-me-seller-portal}
      KEYCLOAK_ADMIN_PORTAL_CLIENT_ID: ${KEYCLOAK_ADMIN_PORTAL_CLIENT_ID:-msb-admin-portal}
      KEYCLOAK_ADMIN_PORTAL_CLIENT_SECRET: ${KEYCLOAK_ADMIN_PORTAL_CLIENT_SECRET:-local-dev-only-change-me-admin-portal}
      KEYCLOAK_GATEWAY_ADMIN_CLIENT_ID: ${KEYCLOAK_GATEWAY_ADMIN_CLIENT_ID:-msb-gateway-admin}
      KEYCLOAK_GATEWAY_ADMIN_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_ADMIN_CLIENT_SECRET:-local-dev-only-change-me-gateway-admin}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      GATEWAY_LOGOUT_REDIRECT_URI: ${GATEWAY_LOGOUT_REDIRECT_URI:-http://localhost:4200/}
      GATEWAY_SESSION_COOKIE_SECURE: ${GATEWAY_SESSION_COOKIE_SECURE:-false}
      GATEWAY_SESSION_TIMEOUT: ${GATEWAY_SESSION_TIMEOUT:-30m}
      JWT_SECRET: ${JWT_SECRET:-demo-change-me-at-least-32-bytes-long}
    depends_on:
      - product-service
      - chat-service
      - auth-service
      - keycloak
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_CONFIGURATION: ${FRONTEND_BUILD_CONFIGURATION:-production}
        GATEWAY_FEATURE_AGENT_DISCOVERY: ${GATEWAY_FEATURE_AGENT_DISCOVERY:-false}
    container_name: msb-demo-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  demo_mongo_data:
  demo_mysql_data:
  demo_postgres_keycloak_data:
  demo_agent_opensearch_data:
