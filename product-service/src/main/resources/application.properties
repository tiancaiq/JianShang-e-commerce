spring.application.name=product-service
spring.config.import=optional:file:.env.demo[.properties],optional:file:../.env.demo[.properties],optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
server.port=8091

# MySQL catalog schema
spring.datasource.url=jdbc:mysql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:${MYSQL_PORT:3306}}/${CATALOG_DB_NAME:catalog}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${CATALOG_DB_USERNAME:root}
spring.datasource.password=${CATALOG_DB_PASSWORD:${MYSQL_ROOT_PASSWORD:demo-change-me-mysql}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/catalog

# Keycloak resource server validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/msb-local}

# Service URLs
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8085}
commerce.internal-service-token=${COMMERCE_INTERNAL_SERVICE_TOKEN:local-commerce-service-token}
agent.internal-service-token=${AGENT_INTERNAL_SERVICE_TOKEN:local-agent-service-token}
agent.listing-media-tool-enabled=${AGENT_LISTING_MEDIA_TOOL_ENABLED:false}

# Versioned listing knowledge publication
listing.knowledge.publication.backfill-enabled=${LISTING_KNOWLEDGE_BACKFILL_ENABLED:true}
listing.knowledge.publication.publisher-enabled=${LISTING_KNOWLEDGE_PUBLISHER_ENABLED:false}
listing.knowledge.publication.topic=${LISTING_KNOWLEDGE_EVENT_TOPIC:listing-knowledge-v1}
listing.knowledge.publication.batch-size=${LISTING_KNOWLEDGE_PUBLISH_BATCH_SIZE:50}
listing.knowledge.publication.poll-interval-ms=${LISTING_KNOWLEDGE_PUBLISH_INTERVAL_MS:5000}
listing.knowledge.publication.claim-seconds=${LISTING_KNOWLEDGE_CLAIM_SECONDS:300}
listing.knowledge.publication.send-timeout=${LISTING_KNOWLEDGE_SEND_TIMEOUT:PT5S}
listing.knowledge.publication.retry-base=${LISTING_KNOWLEDGE_RETRY_BASE:PT2S}
listing.knowledge.publication.retry-max=${LISTING_KNOWLEDGE_RETRY_MAX:PT5M}
category.guidance.publication.topic=${CATEGORY_GUIDANCE_EVENT_TOPIC:category-guidance-v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Authenticated listing report intake remains hidden and disabled until retention/legal approval.
listing-reports.intake-enabled=${LISTING_REPORTS_INTAKE_ENABLED:false}
listing-reports.retention-policy-approved=${LISTING_REPORTS_RETENTION_POLICY_APPROVED:false}
listing-reports.reporter-identity-disclosure-enabled=false
listing-reports.abuse-hmac-secret=${LISTING_REPORTS_ABUSE_HMAC_SECRET:disabled-only-listing-report-hmac-key}
listing-reports.policy-version=REP-00-V1
listing-reports.event-topic=${LISTING_REPORTS_EVENT_TOPIC:listing-report-v1}
listing-reports.idempotency-retention=P90D
listing-reports.duplicate-window=PT24H
listing-reports.content-retention=P180D
listing-reports.metadata-retention=P730D
listing-reports.hourly-limit=5
listing-reports.daily-limit=20

# Listing media object storage
listing.media.storage=${LISTING_MEDIA_STORAGE:local-demo}
listing.media.max-image-size-bytes=${LISTING_MEDIA_MAX_IMAGE_SIZE_BYTES:10485760}
listing.media.signed-url-ttl=${LISTING_MEDIA_SIGNED_URL_TTL:PT15M}
listing.media.s3.endpoint-url=${S3_ENDPOINT_URL:}
listing.media.s3.region=${S3_REGION:us-east-1}
listing.media.s3.bucket=${S3_BUCKET:listing-media-local}
listing.media.s3.access-key-id=${S3_ACCESS_KEY_ID:}
listing.media.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
listing.media.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}

# Public listing search projection
listing.search.engine=${LISTING_SEARCH_ENGINE:mysql}
listing.search.opensearch.base-url=${OPENSEARCH_URL:http://localhost:9201}
listing.search.opensearch.index=${OPENSEARCH_LISTING_INDEX:marketplace-listings}
listing.search.opensearch.write-alias=${OPENSEARCH_LISTING_WRITE_ALIAS:marketplace-listings-write}
listing.search.opensearch.physical-index=${OPENSEARCH_LISTING_PHYSICAL_INDEX:marketplace-listings-v1}
listing.search.opensearch.connect-timeout=${OPENSEARCH_CONNECT_TIMEOUT:PT1S}
listing.search.opensearch.request-timeout=${OPENSEARCH_REQUEST_TIMEOUT:PT3S}
listing.search.opensearch.initialize-index=${OPENSEARCH_INITIALIZE_INDEX:true}
listing.search.projection-sync.enabled=${LISTING_SEARCH_PROJECTION_SYNC_ENABLED:false}
listing.search.projection-sync.batch-size=${LISTING_SEARCH_PROJECTION_SYNC_BATCH_SIZE:50}
listing.search.projection-sync.poll-interval-ms=${LISTING_SEARCH_PROJECTION_SYNC_POLL_INTERVAL_MS:5000}
listing.search.projection-sync.claim-seconds=${LISTING_SEARCH_PROJECTION_SYNC_CLAIM_SECONDS:60}
listing.search.projection-sync.max-attempts=${LISTING_SEARCH_PROJECTION_SYNC_MAX_ATTEMPTS:20}
listing.search.projection-sync.retry-base=${LISTING_SEARCH_PROJECTION_SYNC_RETRY_BASE:PT2S}
listing.search.projection-sync.retry-max=${LISTING_SEARCH_PROJECTION_SYNC_RETRY_MAX:PT5M}

# Inactive Product-owned V2 vector generation/backfill. This never promotes aliases and is false by default.
listing.search.vector-backfill.enabled=${LISTING_SEARCH_VECTOR_BACKFILL_ENABLED:false}
listing.search.vector-backfill.physical-index-prefix=${LISTING_SEARCH_VECTOR_INDEX_PREFIX:marketplace-listings-v2}
listing.search.vector-backfill.batch-size=${LISTING_SEARCH_VECTOR_BACKFILL_BATCH_SIZE:100}
listing.search.vector-backfill.max-documents=${LISTING_SEARCH_VECTOR_BACKFILL_MAX_DOCUMENTS:100000}
listing.search.vector-backfill.max-bulk-bytes=${LISTING_SEARCH_VECTOR_BACKFILL_MAX_BULK_BYTES:5000000}
listing.search.vector-backfill.cleanup-failed-generation=${LISTING_SEARCH_VECTOR_BACKFILL_CLEANUP_FAILED_GENERATION:true}
listing.search.promotion.rebuild-enabled=${LISTING_SEARCH_PROMOTION_REBUILD_ENABLED:false}
listing.search.promotion.promotion-enabled=${LISTING_SEARCH_PROMOTION_ENABLED:false}
listing.search.promotion.lock-wait-seconds=${LISTING_SEARCH_PROMOTION_LOCK_WAIT_SECONDS:5}
listing.search.promotion.max-catch-up-work=${LISTING_SEARCH_PROMOTION_MAX_CATCH_UP_WORK:10000}

# The authenticated V2 rebuild operator boundary is independently hidden/default-off.
listing.search.operator.commands-enabled=${LISTING_SEARCH_OPERATOR_COMMANDS_ENABLED:false}
listing.search.operator.status-enabled=${LISTING_SEARCH_OPERATOR_STATUS_ENABLED:false}

# Accepted-receipt vector application is independently default-off.
listing.search.vector-sync.enabled=${LISTING_SEARCH_VECTOR_SYNC_ENABLED:false}
listing.search.vector-sync.worker-enabled=${LISTING_SEARCH_VECTOR_SYNC_WORKER_ENABLED:false}
listing.search.vector-sync.batch-size=${LISTING_SEARCH_VECTOR_SYNC_BATCH_SIZE:25}
listing.search.vector-sync.poll-interval-ms=${LISTING_SEARCH_VECTOR_SYNC_POLL_INTERVAL_MS:5000}
listing.search.vector-sync.claim-seconds=${LISTING_SEARCH_VECTOR_SYNC_CLAIM_SECONDS:60}
listing.search.vector-sync.max-attempts=${LISTING_SEARCH_VECTOR_SYNC_MAX_ATTEMPTS:20}
listing.search.vector-sync.retry-base=${LISTING_SEARCH_VECTOR_SYNC_RETRY_BASE:PT2S}
listing.search.vector-sync.retry-max=${LISTING_SEARCH_VECTOR_SYNC_RETRY_MAX:PT5M}
listing.search.vector-sync.catch-up-batch-size=${LISTING_SEARCH_VECTOR_SYNC_CATCH_UP_BATCH_SIZE:100}

# Internal Product-owned hybrid retrieval remains independently default-off.
listing.search.hybrid.enabled=${LISTING_SEARCH_HYBRID_ENABLED:false}
listing.search.hybrid.single-branch-fallback-enabled=${LISTING_SEARCH_HYBRID_SINGLE_BRANCH_FALLBACK_ENABLED:false}
listing.search.hybrid.concept-ranking.exact-phrase-boost=${LISTING_SEARCH_HYBRID_EXACT_PHRASE_BOOST:12}
listing.search.hybrid.concept-ranking.title-concept-weight=${LISTING_SEARCH_HYBRID_TITLE_CONCEPT_WEIGHT:8}
listing.search.hybrid.concept-ranking.structured-type-weight=${LISTING_SEARCH_HYBRID_STRUCTURED_TYPE_WEIGHT:5}
listing.search.hybrid.concept-ranking.description-concept-weight=${LISTING_SEARCH_HYBRID_DESCRIPTION_CONCEPT_WEIGHT:2}
listing.search.hybrid.concept-ranking.missing-concept-penalty=${LISTING_SEARCH_HYBRID_MISSING_CONCEPT_PENALTY:12}
listing.search.hybrid.concept-ranking.unrelated-type-penalty=${LISTING_SEARCH_HYBRID_UNRELATED_TYPE_PENALTY:20}
listing.search.hybrid.concept-ranking.minimum-direct-score=${LISTING_SEARCH_HYBRID_MINIMUM_DIRECT_SCORE:12}
listing.search.hybrid.concept-ranking.minimum-related-score=${LISTING_SEARCH_HYBRID_MINIMUM_RELATED_SCORE:2}

# Product-owned discovery embedding requests and exact source reads remain independently default-off.
listing.search.embedding.request-enabled=${LISTING_SEARCH_EMBEDDING_REQUEST_ENABLED:false}
listing.search.embedding.source-enabled=${LISTING_SEARCH_EMBEDDING_SOURCE_ENABLED:false}
listing.search.embedding.result-enabled=${LISTING_SEARCH_EMBEDDING_RESULT_ENABLED:false}
listing.search.embedding.topic=${LISTING_SEARCH_EMBEDDING_EVENT_TOPIC:listing-discovery-embedding-request-v1}

# Existing eligible listing embedding-request backfill is independently hidden/default-off.
listing.search.embedding.backfill.commands-enabled=${LISTING_SEARCH_EMBEDDING_BACKFILL_COMMANDS_ENABLED:false}
listing.search.embedding.backfill.status-enabled=${LISTING_SEARCH_EMBEDDING_BACKFILL_STATUS_ENABLED:false}
listing.search.embedding.backfill.page-size=${LISTING_SEARCH_EMBEDDING_BACKFILL_PAGE_SIZE:50}
listing.search.embedding.backfill.max-listings=${LISTING_SEARCH_EMBEDDING_BACKFILL_MAX_LISTINGS:100000}
listing.search.embedding.backfill.lease-duration=${LISTING_SEARCH_EMBEDDING_BACKFILL_LEASE_DURATION:PT2M}
